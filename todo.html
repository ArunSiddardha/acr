<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 600px;
            padding: 30px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
        }

        .input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #todoInput {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        #todoInput:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 15px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .btn-add {
            background: #667eea;
            color: white;
        }

        .btn-add:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-add:active {
            transform: translateY(0);
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            background: #f5f5f5;
            color: #666;
            border: 2px solid transparent;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #5568d3;
        }

        .todo-list {
            list-style: none;
        }

        .todo-item {
            background: #f9f9f9;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .todo-item:hover {
            background: #f0f0f0;
            transform: translateX(5px);
        }

        .todo-item.completed {
            opacity: 0.6;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #999;
        }

        .todo-checkbox {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .todo-text {
            flex: 1;
            font-size: 16px;
            color: #333;
            word-break: break-word;
        }

        .btn-delete {
            padding: 8px 15px;
            background: #ff6b6b;
            color: white;
            font-size: 14px;
        }

        .btn-delete:hover {
            background: #ff5252;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 18px;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .stats span {
            font-weight: 600;
            color: #667eea;
        }

        .priority-selector {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }

        .priority-btn {
            padding: 5px 15px;
            font-size: 12px;
            border: 2px solid #e0e0e0;
            background: white;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.2s;
        }

        .priority-btn.active {
            border-width: 2px;
        }

        .priority-btn.high {
            color: #ff4444;
            border-color: #ff4444;
        }

        .priority-btn.high.active {
            background: #ff4444;
            color: white;
        }

        .priority-btn.medium {
            color: #ffa500;
            border-color: #ffa500;
        }

        .priority-btn.medium.active {
            background: #ffa500;
            color: white;
        }

        .priority-btn.low {
            color: #4caf50;
            border-color: #4caf50;
        }

        .priority-btn.low.active {
            background: #4caf50;
            color: white;
        }

        .priority-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .priority-badge.high {
            background: #ff444433;
            color: #ff4444;
        }

        .priority-badge.medium {
            background: #ffa50033;
            color: #ffa500;
        }

        .priority-badge.low {
            background: #4caf5033;
            color: #4caf50;
        }

        .due-date-input {
            padding: 5px 10px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
        }

        .due-date-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            background: #e3f2fd;
            color: #1976d2;
        }

        .due-date-badge.overdue {
            background: #ffebee;
            color: #c62828;
        }

        .btn-edit {
            padding: 8px 15px;
            background: #4caf50;
            color: white;
            font-size: 14px;
        }

        .btn-edit:hover {
            background: #45a049;
        }

        .btn-clear-completed {
            padding: 10px 20px;
            background: #ff6b6b;
            color: white;
            margin-left: auto;
        }

        .btn-clear-completed:hover {
            background: #ff5252;
        }

        .search-container {
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .todo-item.dragging {
            opacity: 0.5;
        }

        .todo-item-content {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .todo-main {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .todo-metadata {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .drag-handle {
            cursor: grab;
            color: #999;
            font-size: 20px;
            user-select: none;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        .input-section {
            margin-bottom: 15px;
        }

        .actions-row {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>My Todo List</h1>

        <div class="input-section">
            <div class="input-container">
                <input
                    type="text"
                    id="todoInput"
                    placeholder="What needs to be done?"
                    autocomplete="off"
                >
                <button class="btn btn-add" onclick="addTodo()">Add</button>
            </div>

            <div class="priority-selector">
                <label style="margin-right: 10px; font-size: 14px; color: #666;">Priority:</label>
                <button class="btn priority-btn low active" data-priority="low" onclick="selectPriority('low')">Low</button>
                <button class="btn priority-btn medium" data-priority="medium" onclick="selectPriority('medium')">Medium</button>
                <button class="btn priority-btn high" data-priority="high" onclick="selectPriority('high')">High</button>
            </div>

            <div style="margin-top: 10px;">
                <label style="font-size: 14px; color: #666; margin-right: 10px;">Due Date:</label>
                <input type="date" id="dueDateInput" class="due-date-input">
            </div>
        </div>

        <div class="search-container">
            <input
                type="text"
                id="searchInput"
                class="search-input"
                placeholder="Search todos..."
                oninput="renderTodos()"
            >
        </div>

        <div class="filters">
            <button class="btn filter-btn active" data-filter="all" onclick="filterTodos('all')">All</button>
            <button class="btn filter-btn" data-filter="active" onclick="filterTodos('active')">Active</button>
            <button class="btn filter-btn" data-filter="completed" onclick="filterTodos('completed')">Completed</button>
            <button class="btn btn-clear-completed" onclick="clearCompleted()">Clear Completed</button>
        </div>

        <ul class="todo-list" id="todoList"></ul>

        <div class="stats">
            <div>Total: <span id="totalCount">0</span></div>
            <div>Active: <span id="activeCount">0</span></div>
            <div>Completed: <span id="completedCount">0</span></div>
        </div>
    </div>

    <script>
        let todos = [];
        let currentFilter = 'all';
        let selectedPriority = 'low';
        let editingTodoId = null;

        // Load todos from localStorage on page load
        function loadTodos() {
            const savedTodos = localStorage.getItem('todos');
            if (savedTodos) {
                todos = JSON.parse(savedTodos);
                renderTodos();
            }
        }

        // Save todos to localStorage
        function saveTodos() {
            localStorage.setItem('todos', JSON.stringify(todos));
        }

        // Select priority
        function selectPriority(priority) {
            selectedPriority = priority;
            document.querySelectorAll('.priority-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-priority="${priority}"]`).classList.add('active');
        }

        // Add new todo
        function addTodo() {
            const input = document.getElementById('todoInput');
            const text = input.value.trim();
            const dueDateInput = document.getElementById('dueDateInput');

            if (text === '') {
                alert('Please enter a todo item!');
                return;
            }

            if (editingTodoId) {
                // Update existing todo
                const todo = todos.find(t => t.id === editingTodoId);
                if (todo) {
                    todo.text = text;
                    todo.priority = selectedPriority;
                    todo.dueDate = dueDateInput.value || null;
                }
                editingTodoId = null;
                document.querySelector('.btn-add').textContent = 'Add';
            } else {
                // Create new todo
                const todo = {
                    id: Date.now(),
                    text: text,
                    completed: false,
                    priority: selectedPriority,
                    dueDate: dueDateInput.value || null,
                    createdAt: new Date().toISOString()
                };
                todos.push(todo);
            }

            input.value = '';
            dueDateInput.value = '';
            selectPriority('low');
            saveTodos();
            renderTodos();
        }

        // Toggle todo completion
        function toggleTodo(id) {
            const todo = todos.find(t => t.id === id);
            if (todo) {
                todo.completed = !todo.completed;
                saveTodos();
                renderTodos();
            }
        }

        // Delete todo
        function deleteTodo(id) {
            if (confirm('Are you sure you want to delete this todo?')) {
                todos = todos.filter(t => t.id !== id);
                saveTodos();
                renderTodos();
            }
        }

        // Edit todo
        function editTodo(id) {
            const todo = todos.find(t => t.id === id);
            if (todo) {
                document.getElementById('todoInput').value = todo.text;
                document.getElementById('dueDateInput').value = todo.dueDate || '';
                selectPriority(todo.priority || 'low');
                editingTodoId = id;
                document.querySelector('.btn-add').textContent = 'Update';
                document.getElementById('todoInput').focus();
            }
        }

        // Clear all completed todos
        function clearCompleted() {
            const completedCount = todos.filter(t => t.completed).length;
            if (completedCount === 0) {
                alert('No completed todos to clear!');
                return;
            }
            if (confirm(`Delete ${completedCount} completed todo(s)?`)) {
                todos = todos.filter(t => !t.completed);
                saveTodos();
                renderTodos();
            }
        }

        // Filter todos
        function filterTodos(filter) {
            currentFilter = filter;

            // Update active filter button
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-filter="${filter}"]`).classList.add('active');

            renderTodos();
        }

        // Format due date
        function formatDueDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const dueDate = new Date(date);
            dueDate.setHours(0, 0, 0, 0);

            const diffTime = dueDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays < 0) {
                return `Overdue (${date.toLocaleDateString()})`;
            } else if (diffDays === 0) {
                return 'Due Today';
            } else if (diffDays === 1) {
                return 'Due Tomorrow';
            } else {
                return `Due ${date.toLocaleDateString()}`;
            }
        }

        // Check if todo is overdue
        function isOverdue(dateString) {
            if (!dateString) return false;
            const date = new Date(dateString);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const dueDate = new Date(date);
            dueDate.setHours(0, 0, 0, 0);
            return dueDate < today;
        }

        // Drag and drop functions
        let draggedElement = null;

        function handleDragStart(e, id) {
            draggedElement = id;
            e.target.closest('.todo-item').classList.add('dragging');
        }

        function handleDragEnd(e) {
            e.target.closest('.todo-item').classList.remove('dragging');
        }

        function handleDragOver(e) {
            e.preventDefault();
            return false;
        }

        function handleDrop(e, targetId) {
            e.preventDefault();
            if (draggedElement === targetId) return;

            const draggedIndex = todos.findIndex(t => t.id === draggedElement);
            const targetIndex = todos.findIndex(t => t.id === targetId);

            const [removed] = todos.splice(draggedIndex, 1);
            todos.splice(targetIndex, 0, removed);

            saveTodos();
            renderTodos();
        }

        // Render todos
        function renderTodos() {
            const todoList = document.getElementById('todoList');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            // Filter todos based on current filter and search
            let filteredTodos = todos;
            if (currentFilter === 'active') {
                filteredTodos = todos.filter(t => !t.completed);
            } else if (currentFilter === 'completed') {
                filteredTodos = todos.filter(t => t.completed);
            }

            // Apply search filter
            if (searchTerm) {
                filteredTodos = filteredTodos.filter(t =>
                    t.text.toLowerCase().includes(searchTerm)
                );
            }

            // Clear list
            todoList.innerHTML = '';

            // Show empty state if no todos
            if (filteredTodos.length === 0) {
                todoList.innerHTML = '<div class="empty-state">No tasks to show</div>';
            } else {
                // Render each todo
                filteredTodos.forEach(todo => {
                    const li = document.createElement('li');
                    li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
                    li.draggable = true;
                    li.ondragstart = (e) => handleDragStart(e, todo.id);
                    li.ondragend = handleDragEnd;
                    li.ondragover = handleDragOver;
                    li.ondrop = (e) => handleDrop(e, todo.id);

                    const priorityBadge = todo.priority ?
                        `<span class="priority-badge ${todo.priority}">${todo.priority}</span>` : '';

                    const dueDateBadge = todo.dueDate ?
                        `<span class="due-date-badge ${isOverdue(todo.dueDate) ? 'overdue' : ''}">${formatDueDate(todo.dueDate)}</span>` : '';

                    li.innerHTML = `
                        <span class="drag-handle">⋮⋮</span>
                        <input
                            type="checkbox"
                            class="todo-checkbox"
                            ${todo.completed ? 'checked' : ''}
                            onchange="toggleTodo(${todo.id})"
                        >
                        <div class="todo-item-content">
                            <div class="todo-main">
                                <span class="todo-text">${escapeHtml(todo.text)}</span>
                            </div>
                            <div class="todo-metadata">
                                ${priorityBadge}
                                ${dueDateBadge}
                            </div>
                        </div>
                        <button class="btn btn-edit" onclick="editTodo(${todo.id})">Edit</button>
                        <button class="btn btn-delete" onclick="deleteTodo(${todo.id})">Delete</button>
                    `;
                    todoList.appendChild(li);
                });
            }

            updateStats();
        }

        // Update statistics
        function updateStats() {
            const total = todos.length;
            const active = todos.filter(t => !t.completed).length;
            const completed = todos.filter(t => t.completed).length;

            document.getElementById('totalCount').textContent = total;
            document.getElementById('activeCount').textContent = active;
            document.getElementById('completedCount').textContent = completed;
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Handle Enter key press
        document.getElementById('todoInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addTodo();
            }
        });

        // Load todos when page loads
        loadTodos();
    </script>
</body>
</html>
