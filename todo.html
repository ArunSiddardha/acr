---
layout: default
title: Todo App
---

<style>
    .todo-container {
        max-width: 800px;
        margin: 50px auto;
        padding: 30px;
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    
    .todo-header {
        text-align: center;
        margin-bottom: 30px;
        color: #333;
    }
    
    .todo-input-group {
        display: flex;
        gap: 10px;
        margin-bottom: 30px;
    }
    
    .todo-input {
        flex: 1;
        padding: 12px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 5px;
        font-size: 16px;
        transition: border-color 0.3s;
    }
    
    .todo-input:focus {
        outline: none;
        border-color: #667eea;
    }
    
    .btn-add {
        padding: 12px 30px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
        transition: transform 0.2s;
    }
    
    .btn-add:hover {
        transform: translateY(-2px);
    }
    
    .todo-list {
        list-style: none;
        padding: 0;
    }
    
    .todo-item {
        display: flex;
        align-items: center;
        padding: 15px;
        margin-bottom: 10px;
        background: #f8f9fa;
        border-radius: 5px;
        transition: all 0.3s;
    }
    
    .todo-item:hover {
        background: #e9ecef;
        transform: translateX(5px);
    }
    
    .todo-item.completed {
        opacity: 0.6;
    }
    
    .todo-checkbox {
        width: 20px;
        height: 20px;
        margin-right: 15px;
        cursor: pointer;
    }
    
    .todo-text {
        flex: 1;
        font-size: 16px;
        color: #333;
    }
    
    .todo-item.completed .todo-text {
        text-decoration: line-through;
        color: #999;
    }
    
    .btn-delete {
        padding: 8px 15px;
        background: #dc3545;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.3s;
    }
    
    .btn-delete:hover {
        background: #c82333;
    }
    
    .empty-state {
        text-align: center;
        padding: 40px;
        color: #999;
        font-size: 18px;
    }
    
    .todo-stats {
        display: flex;
        justify-content: space-around;
        margin-top: 30px;
        padding: 20px;
        background: #f8f9fa;
        border-radius: 5px;
    }
    
    .stat-item {
        text-align: center;
    }
    
    .stat-number {
        font-size: 24px;
        font-weight: bold;
        color: #667eea;
    }
    
    .stat-label {
        font-size: 14px;
        color: #666;
        margin-top: 5px;
    }
</style>

<div class="todo-container">
    <h1 class="todo-header">📝 My Todo List</h1>
    
    <div class="todo-input-group">
        <input 
            type="text" 
            id="todoInput" 
            class="todo-input" 
            placeholder="What needs to be done?"
            onkeypress="if(event.key === 'Enter') addTodo()"
        >
        <button class="btn-add" onclick="addTodo()">Add Todo</button>
    </div>
    
    <ul id="todoList" class="todo-list"></ul>
    
    <div class="todo-stats">
        <div class="stat-item">
            <div class="stat-number" id="totalTodos">0</div>
            <div class="stat-label">Total</div>
        </div>
        <div class="stat-item">
            <div class="stat-number" id="activeTodos">0</div>
            <div class="stat-label">Active</div>
        </div>
        <div class="stat-item">
            <div class="stat-number" id="completedTodos">0</div>
            <div class="stat-label">Completed</div>
        </div>
    </div>
</div>

<script>
    let todos = [];
    
    // Load todos from localStorage on page load
    function loadTodos() {
        const savedTodos = localStorage.getItem('todos');
        if (savedTodos) {
            todos = JSON.parse(savedTodos);
        }
        renderTodos();
    }
    
    // Save todos to localStorage
    function saveTodos() {
        localStorage.setItem('todos', JSON.stringify(todos));
    }
    
    // Add a new todo
    function addTodo() {
        const input = document.getElementById('todoInput');
        const text = input.value.trim();
        
        if (text === '') {
            alert('Please enter a todo item!');
            return;
        }
        
        const todo = {
            id: Date.now(),
            text: text,
            completed: false,
            createdAt: new Date().toISOString()
        };
        
        todos.push(todo);
        input.value = '';
        saveTodos();
        renderTodos();
    }
    
    // Toggle todo completion
    function toggleTodo(id) {
        const todo = todos.find(t => t.id === id);
        if (todo) {
            todo.completed = !todo.completed;
            saveTodos();
            renderTodos();
        }
    }
    
    // Delete a todo
    function deleteTodo(id) {
        todos = todos.filter(t => t.id !== id);
        saveTodos();
        renderTodos();
    }
    
    // Render todos to the DOM
    function renderTodos() {
        const todoList = document.getElementById('todoList');
        
        if (todos.length === 0) {
            todoList.innerHTML = '<div class="empty-state">No todos yet. Add one above! 🎯</div>';
        } else {
            todoList.innerHTML = todos.map(todo => `
                <li class="todo-item ${todo.completed ? 'completed' : ''}">
                    <input 
                        type="checkbox" 
                        class="todo-checkbox" 
                        ${todo.completed ? 'checked' : ''}
                        onchange="toggleTodo(${todo.id})"
                    >
                    <span class="todo-text">${escapeHtml(todo.text)}</span>
                    <button class="btn-delete" onclick="deleteTodo(${todo.id})">Delete</button>
                </li>
            `).join('');
        }
        
        updateStats();
    }
    
    // Update statistics
    function updateStats() {
        const total = todos.length;
        const completed = todos.filter(t => t.completed).length;
        const active = total - completed;
        
        document.getElementById('totalTodos').textContent = total;
        document.getElementById('activeTodos').textContent = active;
        document.getElementById('completedTodos').textContent = completed;
    }
    
    // Escape HTML to prevent XSS
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    // Initialize on page load
    document.addEventListener('DOMContentLoaded', loadTodos);
</script>
