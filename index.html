<div class="todo-container">
  <h1 class="todo-title">My Todos</h1>

  <div class="todo-input-section">
    <input type="text" id="todoInput" class="todo-input" placeholder="Enter a new todo...">
    <button id="addTodoBtn" class="add-todo-btn">Add Todo</button>
  </div>

  <div class="todos-list" id="todosList">
    <!-- Todos will be dynamically added here -->
  </div>
</div>
