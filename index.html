<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Notes App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 My Notes</h1>
            <button id="newNoteBtn" class="btn-primary">+ New Note</button>
        </header>

        <div class="main-content">
            <aside class="sidebar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search notes...">
                </div>
                <div id="notesList" class="notes-list">
                    <!-- Notes will be dynamically added here -->
                </div>
            </aside>

            <main class="editor-section">
                <div id="emptyState" class="empty-state">
                    <div class="empty-icon">📄</div>
                    <h2>No note selected</h2>
                    <p>Create a new note or select an existing one to get started</p>
                </div>

                <div id="editorContainer" class="editor-container" style="display: none;">
                    <div class="editor-header">
                        <input type="text" id="noteTitle" placeholder="Note title..." class="note-title-input">
                        <div class="editor-actions">
                            <button id="deleteBtn" class="btn-delete" title="Delete note">🗑️ Delete</button>
                        </div>
                    </div>
                    <textarea id="noteContent" placeholder="Start typing your note..."></textarea>
                    <div class="editor-footer">
                        <span id="charCount" class="char-count">0 characters</span>
                        <span id="lastSaved" class="last-saved"></span>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
