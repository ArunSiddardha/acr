---
layout: default
title: Notes App
---
<div class="notes-container">
  <h1 class="notes-title">My Notes</h1>
  
  <div class="note-input-section">
    <input type="text" id="noteTitle" class="note-title-input" placeholder="Note Title">
    <textarea id="noteContent" class="note-content-input" placeholder="Write your note here..." rows="6"></textarea>
    <button id="addNoteBtn" class="add-note-btn">Add Note</button>
  </div>
  
  <div class="notes-list" id="notesList">
    <!-- Notes will be dynamically added here -->
  </div>
</div>
