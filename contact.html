---
layout: default
title: Contact Us
---

<div class="contact-container">
  <div class="contact-header">
    <h1>Contact Us</h1>
    <p>Have questions? We'd love to hear from you. Send us a message and we'll respond as soon as possible.</p>
  </div>

  <div class="contact-content">
    <div class="contact-info">
      <div class="info-item">
        <h3>Email</h3>
        <p>{{ site.email }}</p>
      </div>
      <div class="info-item">
        <h3>Address</h3>
        <p>IIT Hyderabad<br>
        Kandi, Sangareddy<br>
        Telangana - 502285</p>
      </div>
      <div class="info-item">
        <h3>Follow Us</h3>
        <div class="social-links">
          <a href="#" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
          <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
          <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
          <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
        </div>
      </div>
    </div>

    <div class="contact-form-wrapper">
      <form id="contactForm" class="contact-form" method="POST" action="https://formspree.io/f/YOUR_FORM_ID">
        <div class="form-group">
          <label for="name">Full Name <span class="required">*</span></label>
          <input type="text" id="name" name="name" required placeholder="Enter your full name">
          <span class="error-message" id="nameError"></span>
        </div>

        <div class="form-group">
          <label for="email">Email Address <span class="required">*</span></label>
          <input type="email" id="email" name="email" required placeholder="Enter your email address">
          <span class="error-message" id="emailError"></span>
        </div>

        <div class="form-group">
          <label for="subject">Subject <span class="required">*</span></label>
          <input type="text" id="subject" name="subject" required placeholder="What is this regarding?">
          <span class="error-message" id="subjectError"></span>
        </div>

        <div class="form-group">
          <label for="message">Message <span class="required">*</span></label>
          <textarea id="message" name="message" rows="6" required placeholder="Write your message here..."></textarea>
          <span class="error-message" id="messageError"></span>
        </div>

        <button type="submit" class="submit-btn">
          <span class="btn-text">Send Message</span>
          <span class="btn-loader" style="display: none;">Sending...</span>
        </button>

        <div class="form-status" id="formStatus"></div>
      </form>
    </div>
  </div>
</div>

<script src="{{ site.baseurl }}/assets/js/contact.js"></script>
