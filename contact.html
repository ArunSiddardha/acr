---
layout: default
title: Contact Us
---

<section class="contactSection">
    <div class="container">
        <h1 style="text-align: center; margin-top: 2rem; margin-bottom: 2rem;">Contact Us</h1>
        
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="contactCard">
                    <p style="text-align: center; margin-bottom: 2rem; font-size: 1.1rem;">
                        Have questions or want to get in touch? Fill out the form below and we'll get back to you as soon as possible.
                    </p>
                    
                    <form id="contactForm" class="contact-form" novalidate>
                        <div class="form-group">
                            <label for="name">Name <span class="required">*</span></label>
                            <input 
                                type="text" 
                                class="form-control" 
                                id="name" 
                                name="name" 
                                placeholder="Enter your full name"
                                required
                            >
                            <div class="error-message" id="nameError"></div>
                        </div>

                        <div class="form-group">
                            <label for="email">Email <span class="required">*</span></label>
                            <input 
                                type="email" 
                                class="form-control" 
                                id="email" 
                                name="email" 
                                placeholder="Enter your email address"
                                required
                            >
                            <div class="error-message" id="emailError"></div>
                        </div>

                        <div class="form-group">
                            <label for="subject">Subject <span class="required">*</span></label>
                            <input 
                                type="text" 
                                class="form-control" 
                                id="subject" 
                                name="subject" 
                                placeholder="Enter the subject"
                                required
                            >
                            <div class="error-message" id="subjectError"></div>
                        </div>

                        <div class="form-group">
                            <label for="message">Message <span class="required">*</span></label>
                            <textarea 
                                class="form-control" 
                                id="message" 
                                name="message" 
                                rows="6" 
                                placeholder="Enter your message"
                                required
                            ></textarea>
                            <div class="error-message" id="messageError"></div>
                        </div>

                        <div class="form-group text-center">
                            <button type="submit" class="btn btn-submit">Send Message</button>
                        </div>

                        <div id="formMessage" class="form-message"></div>
                    </form>
                </div>
            </div>
        </div>

        <div class="row justify-content-center" style="margin-top: 3rem;">
            <div class="col-lg-8 col-md-10">
                <div class="contactInfo">
                    <h3 style="text-align: center; margin-bottom: 1.5rem;">Get In Touch</h3>
                    <div class="row">
                        <div class="col-md-4 text-center">
                            <div class="info-item">
                                <i class="fas fa-envelope fa-2x"></i>
                                <h5>Email</h5>
                                <p>alumni@example.com</p>
                            </div>
                        </div>
                        <div class="col-md-4 text-center">
                            <div class="info-item">
                                <i class="fas fa-phone fa-2x"></i>
                                <h5>Phone</h5>
                                <p>+91 123 456 7890</p>
                            </div>
                        </div>
                        <div class="col-md-4 text-center">
                            <div class="info-item">
                                <i class="fas fa-map-marker-alt fa-2x"></i>
                                <h5>Location</h5>
                                <p>IIT Hyderabad</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<div class="empty"></div>
