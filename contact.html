---
layout: default
title: Contact
---
<div class="container-fluid">
  <h1>Contact Us</h1>
  <p style="font-size: 1.2em; margin-top: 20px;">Get in touch with the Alumni Association</p>
</div>

<section class="contact-section">
  <div class="contact-container">
    <div class="contact-info">
      <h2>Let's Connect</h2>
      <p>Have questions or want to get involved? We'd love to hear from you. Fill out the form and we'll get back to you as soon as possible.</p>
      
      <div class="contact-details">
        <div class="contact-item">
          <h3>Email</h3>
          <p>{{ site.email }}</p>
        </div>
        <div class="contact-item">
          <h3>Follow Us</h3>
          <div class="social-links">
            <a href="#" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
            <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
            <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
          </div>
        </div>
      </div>
    </div>

    <div class="contact-form-wrapper">
      <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST" class="contact-form">
        <div class="form-group">
          <label for="name">Full Name <span class="required">*</span></label>
          <input type="text" id="name" name="name" required placeholder="Enter your full name">
        </div>

        <div class="form-group">
          <label for="email">Email Address <span class="required">*</span></label>
          <input type="email" id="email" name="email" required placeholder="your.email@example.com">
        </div>

        <div class="form-group">
          <label for="subject">Subject <span class="required">*</span></label>
          <input type="text" id="subject" name="subject" required placeholder="What is this regarding?">
        </div>

        <div class="form-group">
          <label for="message">Message <span class="required">*</span></label>
          <textarea id="message" name="message" rows="6" required placeholder="Tell us more about your inquiry..."></textarea>
        </div>

        <button type="submit" class="submit-btn">Send Message</button>
      </form>
    </div>
  </div>
</section>

<div class="empty"></div>
