---
layout: default
title: Contact
---
<div class="container" style="max-width: 800px; margin: 50px auto; padding: 40px; background-color: #f8f9fa; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
    <h1 style="text-align: center; color: #0e0e0e; margin-bottom: 30px; font-family: 'Acme', sans-serif;">Contact Us</h1>
    <p style="text-align: center; color: #666; margin-bottom: 40px; font-family: 'Comic Neue', cursive;">
        We'd love to hear from you! Please fill out the form below and we'll get back to you as soon as possible.
    </p>
    
    <form id="contactForm" style="display: flex; flex-direction: column; gap: 20px;">
        <div class="form-group">
            <label for="name" style="display: block; margin-bottom: 5px; color: #0e0e0e; font-weight: bold; font-family: 'Acme', sans-serif;">Name *</label>
            <input type="text" id="name" name="name" required 
                   style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 5px; font-size: 16px; transition: border-color 0.3s; box-sizing: border-box;"
                   placeholder="Enter your full name">
        </div>
        
        <div class="form-group">
            <label for="email" style="display: block; margin-bottom: 5px; color: #0e0e0e; font-weight: bold; font-family: 'Acme', sans-serif;">Email *</label>
            <input type="email" id="email" name="email" required 
                   style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 5px; font-size: 16px; transition: border-color 0.3s; box-sizing: border-box;"
                   placeholder="your.email@example.com">
        </div>
        
        <div class="form-group">
            <label for="subject" style="display: block; margin-bottom: 5px; color: #0e0e0e; font-weight: bold; font-family: 'Acme', sans-serif;">Subject *</label>
            <input type="text" id="subject" name="subject" required 
                   style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 5px; font-size: 16px; transition: border-color 0.3s; box-sizing: border-box;"
                   placeholder="What is this regarding?">
        </div>
        
        <div class="form-group">
            <label for="message" style="display: block; margin-bottom: 5px; color: #0e0e0e; font-weight: bold; font-family: 'Acme', sans-serif;">Message *</label>
            <textarea id="message" name="message" required rows="6" 
                      style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 5px; font-size: 16px; transition: border-color 0.3s; resize: vertical; box-sizing: border-box;"
                      placeholder="Please tell us more about your inquiry..."></textarea>
        </div>
        
        <button type="submit" 
                style="background-color: #0e0e0e; color: white; padding: 15px 30px; border: none; border-radius: 5px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background-color 0.3s; font-family: 'Acme', sans-serif; margin-top: 10px;">
            Send Message
        </button>
    </form>
    
    <div id="successMessage" style="display: none; margin-top: 20px; padding: 15px; background-color: #d4edda; border: 1px solid #c3e6cb; border-radius: 5px; color: #155724; text-align: center; font-family: 'Comic Neue', cursive;">
        Thank you for your message! We'll get back to you soon.
    </div>
    
    <div id="errorMessage" style="display: none; margin-top: 20px; padding: 15px; background-color: #f8d7da; border: 1px solid #f5c6cb; border-radius: 5px; color: #721c24; text-align: center; font-family: 'Comic Neue', cursive;">
        There was an error sending your message. Please try again.
    </div>
</div>

<style>
.form-group input:focus,
.form-group textarea:focus {
    border-color: #0e0e0e;
    outline: none;
    box-shadow: 0 0 5px rgba(14, 14, 14, 0.3);
}

button:hover {
    background-color: #333;
}

@media (max-width: 768px) {
    .container {
        margin: 20px auto;
        padding: 20px;
    }
}
</style>
