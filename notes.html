<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Taking App</title>
    <link rel="stylesheet" href="assets/css/notes-style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>My Notes</h1>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search notes...">
            </div>
        </header>

        <div class="main-content">
            <div class="note-editor">
                <input type="text" id="noteTitle" placeholder="Note Title">
                <textarea id="noteContent" placeholder="Write your note here..."></textarea>
                <div class="editor-actions">
                    <button id="addNoteBtn" class="btn btn-primary">Add Note</button>
                    <button id="updateNoteBtn" class="btn btn-success" style="display: none;">Update Note</button>
                    <button id="cancelBtn" class="btn btn-secondary" style="display: none;">Cancel</button>
                </div>
            </div>

            <div class="notes-list">
                <div class="notes-header">
                    <h2>All Notes</h2>
                    <span id="notesCount">0 notes</span>
                </div>
                <div id="notesContainer" class="notes-grid">
                    <!-- Notes will be dynamically added here -->
                </div>
                <div id="emptyState" class="empty-state">
                    <svg width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    <h3>No notes yet</h3>
                    <p>Create your first note to get started!</p>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/notes-app.js"></script>
</body>
</html>
