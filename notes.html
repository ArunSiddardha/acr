---
layout: default
title: Notes
---
<link rel="stylesheet" href="/assets/css/notes.css">

<div class="notes-container">
    <div class="notes-header">
        <h1>My Notes</h1>
        <button id="newNoteBtn" class="btn-primary">+ New Note</button>
    </div>

    <div class="notes-content">
        <div class="notes-sidebar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search notes...">
            </div>
            <div id="notesList" class="notes-list">
                <!-- Notes will be dynamically added here -->
            </div>
        </div>

        <div class="note-editor">
            <div id="emptyState" class="empty-state">
                <h2>No note selected</h2>
                <p>Select a note from the list or create a new one</p>
            </div>

            <div id="editorArea" class="editor-area" style="display: none;">
                <input type="text" id="noteTitle" class="note-title" placeholder="Note title...">
                <textarea id="noteContent" class="note-content" placeholder="Start typing your note..."></textarea>
                <div class="editor-footer">
                    <span id="lastModified" class="last-modified"></span>
                    <div class="editor-actions">
                        <button id="deleteNoteBtn" class="btn-delete">Delete</button>
                        <button id="saveNoteBtn" class="btn-save">Save</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/assets/js/notes.js"></script>
