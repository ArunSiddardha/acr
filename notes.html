<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Taking App</title>
    <link rel="stylesheet" href="assets/css/notes.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>My Notes</h1>
            <p class="subtitle">Organize your thoughts</p>
        </header>

        <div class="notes-wrapper">
            <div class="sidebar">
                <button id="newNoteBtn" class="btn-primary">+ New Note</button>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search notes...">
                </div>
                <div id="notesList" class="notes-list"></div>
            </div>

            <div class="editor-section">
                <div id="emptyState" class="empty-state">
                    <svg width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="12" y1="18" x2="12" y2="12"></line>
                        <line x1="9" y1="15" x2="15" y2="15"></line>
                    </svg>
                    <h2>No note selected</h2>
                    <p>Create a new note or select one from the sidebar</p>
                </div>

                <div id="editorContainer" class="editor-container hidden">
                    <div class="editor-header">
                        <input type="text" id="noteTitle" placeholder="Note title..." class="note-title-input">
                        <div class="editor-actions">
                            <button id="deleteNoteBtn" class="btn-icon" title="Delete note">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <textarea id="noteContent" placeholder="Start typing your note..." class="note-content-input"></textarea>
                    <div class="editor-footer">
                        <span id="lastSaved" class="last-saved">All changes saved</span>
                        <span id="charCount" class="char-count">0 characters</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/notes.js"></script>
</body>
</html>
