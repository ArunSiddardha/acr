---
layout: default
title: Notes
---
<link rel="stylesheet" href="/assets/css/notes.css">

<div class="notes-container">
    <div class="notes-header">
        <h1>My Notes</h1>
        <div class="header-actions">
            <input type="text" id="searchInput" placeholder="Search notes..." class="search-input">
            <button id="addNoteBtn" class="btn btn-primary">+ New Note</button>
        </div>
    </div>

    <div class="notes-content">
        <div class="notes-sidebar">
            <div class="notes-list" id="notesList">
                <!-- Notes will be dynamically added here -->
            </div>
        </div>

        <div class="note-editor" id="noteEditor">
            <div class="empty-state" id="emptyState">
                <svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                <p>Select a note or create a new one</p>
            </div>

            <div class="editor-content" id="editorContent" style="display: none;">
                <input type="text" id="noteTitle" placeholder="Note title..." class="note-title-input">
                <textarea id="noteBody" placeholder="Start typing your note..." class="note-body-input"></textarea>
                <div class="editor-footer">
                    <span class="note-meta" id="noteMeta">Last edited: Never</span>
                    <div class="editor-actions">
                        <button id="deleteNoteBtn" class="btn btn-danger">Delete</button>
                        <button id="saveNoteBtn" class="btn btn-success">Save</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/assets/js/notes.js"></script>
