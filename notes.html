<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Taking App</title>
    <link rel="stylesheet" href="notes.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>My Notes</h1>
            <p class="subtitle">Capture your thoughts and ideas</p>
        </header>

        <div class="add-note-section">
            <input type="text" id="noteTitle" placeholder="Note title..." maxlength="100">
            <textarea id="noteContent" placeholder="Write your note here..." rows="5"></textarea>
            <button id="addNoteBtn" class="btn-primary">Add Note</button>
        </div>

        <div class="search-section">
            <input type="text" id="searchInput" placeholder="Search notes...">
        </div>

        <div class="notes-grid" id="notesContainer">
            <!-- Notes will be dynamically added here -->
        </div>

        <div class="empty-state" id="emptyState">
            <svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
            <p>No notes yet. Start by creating your first note!</p>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Note</h2>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <input type="text" id="editNoteTitle" placeholder="Note title..." maxlength="100">
                <textarea id="editNoteContent" placeholder="Write your note here..." rows="8"></textarea>
            </div>
            <div class="modal-footer">
                <button id="cancelEditBtn" class="btn-secondary">Cancel</button>
                <button id="saveEditBtn" class="btn-primary">Save Changes</button>
            </div>
        </div>
    </div>

    <script src="notes.js"></script>
</body>
</html>
