<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Taking App</title>
    <link rel="stylesheet" href="assets/css/notes.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>My Notes</h1>
            <div class="header-controls">
                <input type="text" id="searchInput" placeholder="Search notes..." class="search-box">
                <button id="themeToggle" class="btn btn-theme">Toggle Theme</button>
            </div>
        </header>

        <div class="main-content">
            <aside class="sidebar">
                <button id="newNoteBtn" class="btn btn-primary btn-full">+ New Note</button>

                <div class="filter-section">
                    <h3>Filter by Tag</h3>
                    <div id="tagFilter" class="tag-filter">
                        <button class="tag-btn active" data-tag="all">All</button>
                    </div>
                </div>

                <div class="stats">
                    <h3>Statistics</h3>
                    <p>Total Notes: <span id="totalNotes">0</span></p>
                    <p>Pinned: <span id="pinnedNotes">0</span></p>
                </div>
            </aside>

            <main class="notes-area">
                <div id="noteEditor" class="note-editor hidden">
                    <div class="editor-header">
                        <input type="text" id="noteTitle" placeholder="Note title..." class="note-title-input">
                        <div class="editor-actions">
                            <button id="pinNote" class="btn btn-icon" title="Pin note">📌</button>
                            <button id="saveNote" class="btn btn-success">Save</button>
                            <button id="cancelEdit" class="btn btn-secondary">Cancel</button>
                        </div>
                    </div>

                    <div class="editor-toolbar">
                        <button class="toolbar-btn" data-format="bold" title="Bold"><strong>B</strong></button>
                        <button class="toolbar-btn" data-format="italic" title="Italic"><em>I</em></button>
                        <button class="toolbar-btn" data-format="underline" title="Underline"><u>U</u></button>
                        <span class="toolbar-divider">|</span>
                        <button class="toolbar-btn" data-format="insertUnorderedList" title="Bullet List">• List</button>
                        <button class="toolbar-btn" data-format="insertOrderedList" title="Numbered List">1. List</button>
                    </div>

                    <div id="noteContent" class="note-content-editor" contenteditable="true" placeholder="Start typing your note..."></div>

                    <div class="editor-footer">
                        <input type="text" id="noteTagsInput" placeholder="Add tags (comma separated)..." class="tags-input">
                        <select id="noteColor" class="color-picker">
                            <option value="default">Default</option>
                            <option value="blue">Blue</option>
                            <option value="green">Green</option>
                            <option value="yellow">Yellow</option>
                            <option value="red">Red</option>
                            <option value="purple">Purple</option>
                        </select>
                    </div>
                </div>

                <div id="notesGrid" class="notes-grid">
                    <div class="empty-state">
                        <h2>No notes yet</h2>
                        <p>Click "New Note" to create your first note</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div id="confirmModal" class="modal hidden">
        <div class="modal-content">
            <h3>Delete Note?</h3>
            <p>Are you sure you want to delete this note? This action cannot be undone.</p>
            <div class="modal-actions">
                <button id="confirmDelete" class="btn btn-danger">Delete</button>
                <button id="cancelDelete" class="btn btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <script src="assets/js/notes.js"></script>
</body>
</html>
